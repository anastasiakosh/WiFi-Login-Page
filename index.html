<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Login Page</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="wifi-login.css">
    <script defer src="script.js"></script>
</head>
<body>
    <form onsubmit="return false;">
        <div class="container" id="wifiCard">
            <h2>WiFi Login</h2>
            <div class="internal">
                <div class="inputs">
                    <label>
                        Network <slot name="x"></slot>
                        <input type="text" id="ssid" class="ssid" placeholder="WiFi network name">
                    </label>
                    <label>
                        Password
                        <input type="password" id="password" class="password" placeholder="Password">
                    </label>
                </div>
            </div>
            <button type="button" onclick="generateQR()">Generate QR Code</button>
            <div id="qrcode"></div>
            <button type="button" onclick="printCard()">Print WiFi Card</button>
        </div>
        <p>Point your phone's camera at the QR code to connect to WiFi</p>
    </form>
</body>
</html>
